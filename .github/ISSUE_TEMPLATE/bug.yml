name: Relatar um bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri o painel e ...
        2. Cliquei em ...
        3. Vi o erro ...
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Onde acontece
      options: [API, Painel, Rotas de plugin, Não sei]
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Versão do Python (`python --version`), do Node (`node -v`) e o banco usado.
      placeholder: Python 3.12, Node 22, PostgreSQL 16
  - type: markdown
    attributes:
      value: "⚠️ Nunca cole o ADMIN_TOKEN, o PLUGIN_HMAC_SECRET ou chaves de licença reais aqui."
